name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hardcoded classic PAT
      - name: Push to registry
        run: |
          echo "ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef12345678" | docker login ghcr.io -u user --password-stdin

      # Hardcoded fine-grained PAT
      - name: Trigger downstream
        run: |
          curl -X POST \
            -H "Authorization: token github_pat_11AAAAAA0xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" \
            https://api.github.com/repos/org/repo/dispatches \
            -d '{"event_type": "deploy"}'

      # Hardcoded app installation token
      - name: Create release
        env:
          TOKEN: ghs_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef12345678
        run: |
          gh release create v1.0.0 --token $TOKEN